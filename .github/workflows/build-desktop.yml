name: Build Desktop Apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # All three release workflows and the four desktop matrix legs would
  # otherwise each try to create the release for a tag that does not exist
  # yet. On v0.2.18 two of them created duplicate drafts and the Android run
  # failed while cleaning its own up, so the APK never reached the release.
  #
  # This job creates it once, before any build can finish. It is idempotent
  # rather than serialized: a concurrency group would have GitHub cancel the
  # queued copy when the third workflow arrived, since only one job per group
  # may wait. Checking first and tolerating a lost race needs no coordination
  # and leaves no cancelled jobs in the run list.
  #
  # Attaching assets to a release that already exists is safe to do
  # concurrently -- only creating it was ever the problem.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          # Another workflow may create it between the check and the create,
          # so losing that race is fine as long as the release then exists.
          if gh release create "$TAG" --repo "$REPO" --draft \
               --title "PocketHLedger $TAG" \
               --notes "Plain text accounting in your pocket. See assets below for downloads."; then
            echo "Created release $TAG."
          else
            echo "Create failed; checking whether another job won the race."
            gh release view "$TAG" --repo "$REPO" >/dev/null
            echo "Release $TAG exists."
          fi

  build:
    needs: create-release
    if: ${{ always() && needs.create-release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `bundles` narrows bundle.targets ("all" in tauri.conf.json) to
          # what each platform actually ships, instead of every bundler.
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
            bundles: dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
            bundles: dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
            bundles: deb,appimage
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            bundles: nsis

    runs-on: ${{ matrix.platform }}
    name: Desktop (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@stable
        with:
          # Same version as rust-toolchain.toml at the repo root.
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: v__VERSION__
          releaseName: "PocketHLedger v__VERSION__"
          releaseBody: "Plain text accounting in your pocket. See assets below for downloads."
          releaseDraft: true
          prerelease: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
          retention-days: 14
