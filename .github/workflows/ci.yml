name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    name: Tests

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@stable
        with:
          # Same version as rust-toolchain.toml at the repo root.
          toolchain: "1.98.0"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Rust tests (parser + core)
        run: cargo test -p hledger-parser -p hledger-core

      # The app crate holds the data-safety tests (atomic writes, staleness
      # checks, lossless merge, storage path sanitization). They need the
      # Linux webkit deps above, so they only run here.
      - name: Rust tests (app)
        run: cargo test -p pockethledger

      - name: Check Tauri compilation
        run: cargo check -p pockethledger
