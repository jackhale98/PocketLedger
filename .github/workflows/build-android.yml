name: Build Android App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # All three release workflows and the four desktop matrix legs would
  # otherwise each try to create the release for a tag that does not exist
  # yet. On v0.2.18 two of them created duplicate drafts and the Android run
  # failed while cleaning its own up, so the APK never reached the release.
  #
  # This job creates it once, before any build can finish. It is idempotent
  # rather than serialized: a concurrency group would have GitHub cancel the
  # queued copy when the third workflow arrived, since only one job per group
  # may wait. Checking first and tolerating a lost race needs no coordination
  # and leaves no cancelled jobs in the run list.
  #
  # Attaching assets to a release that already exists is safe to do
  # concurrently -- only creating it was ever the problem.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          # Another workflow may create it between the check and the create,
          # so losing that race is fine as long as the release then exists.
          if gh release create "$TAG" --repo "$REPO" --draft \
               --title "PocketHLedger $TAG" \
               --notes "Plain text accounting in your pocket. See assets below for downloads."; then
            echo "Created release $TAG."
          else
            echo "Create failed; checking whether another job won the race."
            gh release view "$TAG" --repo "$REPO" >/dev/null
            echo "Release $TAG exists."
          fi

  build-android:
    needs: create-release
    if: ${{ always() && needs.create-release.result != 'failure' }}
    runs-on: ubuntu-latest
    name: Android (arm64)
    env:
      RUST_VERSION: "1.98.0"
      # r28+ links native libraries 16 KB page-size aligned, which Google Play
      # requires for apps targeting Android 15+. Present on the ubuntu-24.04
      # image so sdkmanager finds it locally; see
      # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
      NDK_VERSION: "28.2.13676358"
      # Play rejects a versionCode it has already seen, and Tauri's default
      # (major*1000000 + minor*1000 + patch) repeats whenever a tag is rebuilt.
      # The run number is monotonic across re-runs and manual dispatches.
      # If a build with a higher code was ever uploaded, raise the base.
      ANDROID_VERSION_CODE_BASE: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          # Same version as rust-toolchain.toml at the repo root.
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ndk28-rust1.98

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}"
          NDK_DIR="$ANDROID_HOME/ndk/${NDK_VERSION}"
          test -d "$NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android project
        run: |
          # Only when missing: the generated project carries manifest and
          # plugin customisations, and re-running init would discard them.
          if [ -d src-tauri/gen/android ]; then
            echo "Using the committed android project"
          else
            npx tauri android init
          fi

      - name: Patch generated Android project
        run: |
          set -euo pipefail
          # All three are idempotent; see each script's docstring.
          # 1. Release signing from keystore.properties (unsigned if absent).
          python3 scripts/ci/patch-android-gradle.py src-tauri/gen/android/app/build.gradle.kts
          # 2. Keep the WebView between the status and navigation bars: the
          #    Android WebView does not expose env(safe-area-inset-*).
          MAIN_ACTIVITY=$(find src-tauri/gen/android/app/src/main -name MainActivity.kt | head -1)
          python3 scripts/ci/patch-android-main-activity.py "$MAIN_ACTIVITY"
          # 3. Release-only manifest overlay: drop INTERNET and
          #    usesCleartextTraffic (the app has no network code). Gradle
          #    merges src/release/AndroidManifest.xml into release builds only,
          #    so `tauri android dev` keeps its dev-server access.
          mkdir -p src-tauri/gen/android/app/src/release
          cp src-tauri/android/release/AndroidManifest.xml src-tauri/gen/android/app/src/release/AndroidManifest.xml

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD not all set; building an UNSIGNED release. See docs/android-release-setup.md."
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo -n "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          # Read by the signingConfigs block that patch-android-gradle.py adds.
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Build frontend
        run: npm run build

      - name: Build Android release (AAB + APK, arm64)
        run: |
          set -euo pipefail
          VERSION_CODE=$(( ANDROID_VERSION_CODE_BASE + GITHUB_RUN_NUMBER ))
          echo "versionCode=$VERSION_CODE"
          # --aab is what Play accepts; --apk is kept for sideload testing.
          npx tauri android build --target aarch64 --aab --apk \
            --config "{\"bundle\":{\"android\":{\"versionCode\":$VERSION_CODE}}}"

      - name: Verify the release manifest
        run: |
          set -euo pipefail
          MERGED=$(find src-tauri/gen/android/app/build/intermediates/merged_manifests -ipath "*release*" -name AndroidManifest.xml | head -1)
          if [ -z "$MERGED" ]; then
            echo "::warning::Merged release manifest not found; cannot verify INTERNET removal"
            exit 0
          fi
          echo "Checking $MERGED"
          if grep -q "android.permission.INTERNET" "$MERGED"; then
            echo "::error::INTERNET permission still present in the release manifest"
            exit 1
          fi
          if grep -q "usesCleartextTraffic" "$MERGED"; then
            echo "::error::usesCleartextTraffic still present in the release manifest"
            exit 1
          fi
          echo "Release manifest has no INTERNET permission and no usesCleartextTraffic."
          grep -o 'android:versionCode="[0-9]*"' "$MERGED" || true

      - name: Prepare artifacts
        id: out
        run: |
          set -euo pipefail
          AAB=$(find src-tauri/gen/android -ipath "*release*" -name "*.aab" -type f | head -1)
          APK=$(find src-tauri/gen/android -ipath "*release*" -name "*.apk" -type f | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::No release AAB found"
            exit 1
          fi
          cp "$AAB" PocketHLedger-android-arm64.aab
          echo "AAB: $AAB ($(du -h "$AAB" | cut -f1))"
          if [ -n "$APK" ]; then
            cp "$APK" PocketHLedger-android-arm64.apk
            echo "APK: $APK ($(du -h "$APK" | cut -f1))"
            echo "apk=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release APK found"
            echo "apk=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${SIGNED:-false}" != "true" ]; then
            echo "::warning::Artifacts are unsigned; Play will not accept them and the APK will not install over a signed build."
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            PocketHLedger-android-arm64.aab
            PocketHLedger-android-arm64.apk
          retention-days: 14

      - name: Upload AAB and APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            PocketHLedger-android-arm64.aab
            PocketHLedger-android-arm64.apk
