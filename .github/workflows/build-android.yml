name: Build Android App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # All three release workflows and the four desktop matrix legs would
  # otherwise each try to create the release for a tag that does not exist
  # yet. On v0.2.18 two of them created duplicate drafts and the Android run
  # failed while cleaning its own up, so the APK never reached the release.
  #
  # This job creates it once. The shared concurrency group is repository-wide,
  # so the copy of this job in each workflow queues behind the others rather
  # than racing them; whichever runs first creates the draft and the rest are
  # a no-op update. Attaching assets to a release that already exists is safe
  # to do concurrently -- only creation was ever the problem.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: create-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Ensure the draft release exists
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: PocketHLedger ${{ github.ref_name }}
          body: "Plain text accounting in your pocket. See assets below for downloads."

  build-android:
    needs: create-release
    if: ${{ always() && needs.create-release.result != 'failure' }}
    runs-on: ubuntu-latest
    name: Android (arm64)

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and set NDK
        run: |
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | sort -V | tail -1)
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "Using NDK: $NDK_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android project
        run: |
          # Only when missing: the generated project carries manifest and
          # plugin customisations, and re-running init would discard them.
          if [ -d src-tauri/gen/android ]; then
            echo "Using the committed android project"
          else
            npx tauri android init
          fi

      - name: Build frontend
        run: npm run build

      - name: Build Android APK (arm64)
        run: npx tauri android build --target aarch64 --debug
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: s
          CARGO_PROFILE_DEV_LTO: "true"
          CARGO_PROFILE_DEV_CODEGEN_UNITS: "1"
          CARGO_PROFILE_DEV_STRIP: "true"

      - name: Prepare APK for release
        id: apk
        run: |
          APK=$(find src-tauri/gen/android -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
            echo "Found APK: $APK ($SIZE)"
            cp "$APK" PocketHLedger-android-arm64.apk
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No APK found"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: PocketHLedger-android-arm64.apk
          retention-days: 14

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.apk.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: PocketHLedger-android-arm64.apk
