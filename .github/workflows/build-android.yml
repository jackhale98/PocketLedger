name: Build Android App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # All three release workflows and the four desktop matrix legs would
  # otherwise each try to create the release for a tag that does not exist
  # yet. On v0.2.18 two of them created duplicate drafts and the Android run
  # failed while cleaning its own up, so the APK never reached the release.
  #
  # This job creates it once, before any build can finish. It is idempotent
  # rather than serialized: a concurrency group would have GitHub cancel the
  # queued copy when the third workflow arrived, since only one job per group
  # may wait. Checking first and tolerating a lost race needs no coordination
  # and leaves no cancelled jobs in the run list.
  #
  # Attaching assets to a release that already exists is safe to do
  # concurrently -- only creating it was ever the problem.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          # Another workflow may create it between the check and the create,
          # so losing that race is fine as long as the release then exists.
          if gh release create "$TAG" --repo "$REPO" --draft \
               --title "PocketHLedger $TAG" \
               --notes "Plain text accounting in your pocket. See assets below for downloads."; then
            echo "Created release $TAG."
          else
            echo "Create failed; checking whether another job won the race."
            gh release view "$TAG" --repo "$REPO" >/dev/null
            echo "Release $TAG exists."
          fi

  build-android:
    needs: create-release
    if: ${{ always() && needs.create-release.result != 'failure' }}
    runs-on: ubuntu-latest
    name: Android (arm64)

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and set NDK
        run: |
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | sort -V | tail -1)
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "Using NDK: $NDK_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android project
        run: |
          # Only when missing: the generated project carries manifest and
          # plugin customisations, and re-running init would discard them.
          if [ -d src-tauri/gen/android ]; then
            echo "Using the committed android project"
          else
            npx tauri android init
          fi

      - name: Build frontend
        run: npm run build

      - name: Build Android APK (arm64)
        run: npx tauri android build --target aarch64 --debug
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: s
          CARGO_PROFILE_DEV_LTO: "true"
          CARGO_PROFILE_DEV_CODEGEN_UNITS: "1"
          CARGO_PROFILE_DEV_STRIP: "true"

      - name: Prepare APK for release
        id: apk
        run: |
          APK=$(find src-tauri/gen/android -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
            echo "Found APK: $APK ($SIZE)"
            cp "$APK" PocketHLedger-android-arm64.apk
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No APK found"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: PocketHLedger-android-arm64.apk
          retention-days: 14

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.apk.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: PocketHLedger-android-arm64.apk
