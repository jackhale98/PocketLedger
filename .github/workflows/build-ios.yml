name: Build iOS App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # All three release workflows and the four desktop matrix legs would
  # otherwise each try to create the release for a tag that does not exist
  # yet. On v0.2.18 two of them created duplicate drafts and the Android run
  # failed while cleaning its own up, so the APK never reached the release.
  #
  # This job creates it once, before any build can finish. It is idempotent
  # rather than serialized: a concurrency group would have GitHub cancel the
  # queued copy when the third workflow arrived, since only one job per group
  # may wait. Checking first and tolerating a lost race needs no coordination
  # and leaves no cancelled jobs in the run list.
  #
  # Attaching assets to a release that already exists is safe to do
  # concurrently -- only creating it was ever the problem.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          # Another workflow may create it between the check and the create,
          # so losing that race is fine as long as the release then exists.
          if gh release create "$TAG" --repo "$REPO" --draft \
               --title "PocketHLedger $TAG" \
               --notes "Plain text accounting in your pocket. See assets below for downloads."; then
            echo "Created release $TAG."
          else
            echo "Create failed; checking whether another job won the race."
            gh release view "$TAG" --repo "$REPO" >/dev/null
            echo "Release $TAG exists."
          fi

  build-release:
    needs: create-release
    if: ${{ always() && needs.create-release.result != 'failure' }}
    runs-on: macos-26
    name: iOS Release
    environment: ios-release
    env:
      XCODE_VERSION: "26.6"
      RUST_VERSION: "1.98.0"

    steps:
      - name: Check for signing secrets
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -z "$HAS_CERT" ]; then
            echo "::error::Apple signing secrets not configured"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -euo pipefail
          # Pinned rather than "newest on the runner": App Store Connect
          # requires the iOS 26 SDK, and an unannounced runner image update
          # should not silently change the SDK a release was built with.
          # Versions available on macos-26: see
          # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-Readme.md
          XCODE="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE" ]; then
            echo "::error::$XCODE not on this runner; available: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          # Capture once, parse the variable: piping xcodebuild into head
          # makes head close the pipe early, which crashes Xcode 26.6's
          # xcodebuild with NSFileHandleOperationException (broken pipe).
          VERSION_OUTPUT=$(xcodebuild -version)
          echo "$VERSION_OUTPUT"

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          # Same version as rust-toolchain.toml at the repo root.
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Include the toolchain in the key: a cached staticlib built
          # against an older iOS SDK fails to link against a newer one.
          key: xcode26.6-rust1.98-ios16

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize iOS project
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only when missing: the generated project carries manifest and
          # plugin customisations, and re-running init would discard them.
          if [ -d src-tauri/gen/apple ]; then
            echo "Using the committed ios project"
          else
            npx tauri ios init
          fi

      - name: Copy app icons into generated Xcode project
        run: |
          ICONSET="src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset"
          if [ -d "$ICONSET" ] && [ -d "src-tauri/icons/ios" ]; then
            cp src-tauri/icons/ios/*.png "$ICONSET/"
            echo "Copied iOS app icons"
          else
            echo "Warning: Icon directories not found"
          fi

      - name: Add privacy manifest and restrict to iPhone
        run: |
          set -euo pipefail
          # Idempotent (see the script's docstring). File-sharing, export
          # compliance and document types come from src-tauri/Info.ios.plist,
          # which tauri-cli merges at build time; the assertion step after the
          # build checks that they survived.
          python3 scripts/ci/patch-ios-project.py src-tauri/gen/apple
          # tauri-cli only runs xcodegen during `ios init`, so regenerate the
          # .xcodeproj from the patched spec ourselves.
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen generate --spec src-tauri/gen/apple/project.yml
          grep -n "TARGETED_DEVICE_FAMILY" src-tauri/gen/apple/*.xcodeproj/project.pbxproj | head -2

      - name: Prepare App Store Connect API key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -n "$API_KEY" ]; then
            mkdir -p ~/.private_keys
            echo -n "$API_KEY" | base64 --decode > ~/.private_keys/AuthKey_${API_KEY_ID}.p8
            echo "API_KEY_PATH=$HOME/.private_keys/AuthKey_${API_KEY_ID}.p8" >> $GITHUB_ENV
          fi

      - name: Build iOS release
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.API_KEY_PATH }}
        # --build-number makes CFBundleVersion "<version>.<run number>", so a
        # re-run of the same tag (or a workflow_dispatch) is a new build for
        # App Store Connect instead of a rejected duplicate.
        run: npx tauri ios build --export-method app-store-connect --build-number ${{ github.run_number }}

      - name: Assert Info.ios.plist keys reached the built app
        run: |
          set -euo pipefail
          # The merge happens inside `tauri ios build`; if a tauri-cli update
          # stopped picking up src-tauri/Info.ios.plist, the app's files would
          # silently vanish from Files and every upload would need manual
          # export-compliance answers. Fail loudly instead.
          PLIST=$(find src-tauri/gen/apple -name "Info.plist" -path "*_iOS/*" -not -path "*/build/*" | head -1)
          if [ -z "$PLIST" ]; then
            echo "::error::No iOS Info.plist found under src-tauri/gen/apple"
            exit 1
          fi
          echo "Checking $PLIST"
          for KEY in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace ITSAppUsesNonExemptEncryption CFBundleDocumentTypes UTImportedTypeDeclarations; do
            if ! grep -q "<key>$KEY</key>" "$PLIST"; then
              echo "::error::$KEY missing from $PLIST; src-tauri/Info.ios.plist was not merged"
              exit 1
            fi
          done
          /usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :LSSupportsOpeningDocumentsInPlace" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"
          # The privacy manifest must be in the archived .app's root.
          APP=$(find src-tauri/gen/apple -maxdepth 8 -type d -path "*.xcarchive/Products/Applications/*.app" | head -1)
          if [ -n "$APP" ] && [ ! -f "$APP/PrivacyInfo.xcprivacy" ]; then
            echo "::error::PrivacyInfo.xcprivacy missing from $APP"
            exit 1
          fi
          echo "PrivacyInfo.xcprivacy present in ${APP:-<archive not found, skipped>}"

      - name: Collect dSYMs
        id: dsyms
        run: |
          set -euo pipefail
          # Crash reports from TestFlight/App Store are only symbolicated if
          # the dSYMs for this exact build are kept somewhere.
          DSYM_DIR=$(find src-tauri/gen/apple ~/Library/Developer/Xcode -type d -path "*.xcarchive/dSYMs" 2>/dev/null | head -1)
          if [ -z "$DSYM_DIR" ] || [ -z "$(ls -A "$DSYM_DIR")" ]; then
            echo "::warning::No dSYMs found in the archive"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT="$RUNNER_TEMP/PocketHLedger-${GITHUB_REF_NAME}-ios-dSYMs.zip"
          (cd "$DSYM_DIR" && zip -qr "$OUT" .)
          echo "Zipped $(ls "$DSYM_DIR" | tr '\n' ' ') -> $OUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "zip=$OUT" >> "$GITHUB_OUTPUT"

      - name: Find IPA
        id: find-ipa
        run: |
          FOUND_IPA=$(find src-tauri/gen/apple ~/Library/Developer/Xcode -name "*.ipa" 2>/dev/null | head -1)
          if [ -n "$FOUND_IPA" ]; then
            mkdir -p $RUNNER_TEMP/export
            cp "$FOUND_IPA" $RUNNER_TEMP/export/PocketHLedger.ipa
            echo "ipa_path=$RUNNER_TEMP/export/PocketHLedger.ipa" >> $GITHUB_OUTPUT
          else
            echo "::error::No IPA found after build"
            exit 1
          fi

      - name: Upload to TestFlight
        if: env.API_KEY_PATH != ''
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # `altool --upload-app` is deprecated by Apple but still works for
          # App Store Connect uploads (its replacement is Transporter /
          # iTMSTransporter or the App Store Connect API; notarytool is for
          # notarisation only, not App Store). Keep it until it breaks; see
          # docs/ios-testflight-setup.md.
          xcrun altool --upload-app \
            -f ${{ steps.find-ipa.outputs.ipa_path }} \
            --type ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ${{ steps.find-ipa.outputs.ipa_path }}
          retention-days: 90

      - name: Upload dSYM artifact
        if: steps.dsyms.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-dSYMs
          path: ${{ steps.dsyms.outputs.zip }}
          retention-days: 90

      - name: Upload IPA and dSYMs to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ steps.find-ipa.outputs.ipa_path }}
            ${{ steps.dsyms.outputs.zip }}
