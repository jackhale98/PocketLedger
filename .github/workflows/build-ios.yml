name: Build iOS App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # All three release workflows and the four desktop matrix legs would
  # otherwise each try to create the release for a tag that does not exist
  # yet. On v0.2.18 two of them created duplicate drafts and the Android run
  # failed while cleaning its own up, so the APK never reached the release.
  #
  # This job creates it once, before any build can finish. It is idempotent
  # rather than serialized: a concurrency group would have GitHub cancel the
  # queued copy when the third workflow arrived, since only one job per group
  # may wait. Checking first and tolerating a lost race needs no coordination
  # and leaves no cancelled jobs in the run list.
  #
  # Attaching assets to a release that already exists is safe to do
  # concurrently -- only creating it was ever the problem.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          # Another workflow may create it between the check and the create,
          # so losing that race is fine as long as the release then exists.
          if gh release create "$TAG" --repo "$REPO" --draft \
               --title "PocketHLedger $TAG" \
               --notes "Plain text accounting in your pocket. See assets below for downloads."; then
            echo "Created release $TAG."
          else
            echo "Create failed; checking whether another job won the race."
            gh release view "$TAG" --repo "$REPO" >/dev/null
            echo "Release $TAG exists."
          fi

  build-release:
    needs: create-release
    if: ${{ always() && needs.create-release.result != 'failure' }}
    runs-on: macos-26
    name: iOS Release
    environment: ios-release

    steps:
      - name: Check for signing secrets
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -z "$HAS_CERT" ]; then
            echo "::error::Apple signing secrets not configured"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST/Contents/Developer"
          fi
          # Capture once, parse the variable: piping xcodebuild into head
          # makes head close the pipe early, which crashes Xcode 26.6's
          # xcodebuild with NSFileHandleOperationException (broken pipe).
          VERSION_OUTPUT=$(xcodebuild -version)
          echo "$VERSION_OUTPUT"
          MAJOR=$(echo "$VERSION_OUTPUT" | sed -n '1s/Xcode \([0-9]*\).*/\1/p')
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Xcode $MAJOR is too old. App Store Connect requires the iOS 26 SDK (Xcode 26+); available: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Include the toolchain in the key: a cached staticlib built
          # against an older iOS SDK fails to link against a newer one.
          key: xcode26-ios16

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize iOS project
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only when missing: the generated project carries manifest and
          # plugin customisations, and re-running init would discard them.
          if [ -d src-tauri/gen/apple ]; then
            echo "Using the committed ios project"
          else
            npx tauri ios init
          fi

      - name: Copy app icons into generated Xcode project
        run: |
          ICONSET="src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset"
          if [ -d "$ICONSET" ] && [ -d "src-tauri/icons/ios" ]; then
            cp src-tauri/icons/ios/*.png "$ICONSET/"
            echo "Copied iOS app icons"
          else
            echo "Warning: Icon directories not found"
          fi

      - name: Expose the app's Documents folder in Files
        run: |
          set -euo pipefail
          # This pair is what makes Documents visible and editable in place
          # under "On My iPhone > PocketHLedger", which is what lets a git
          # client track the journals.
          #
          # UISupportsDocumentBrowser is deliberately NOT set: it grants the
          # same Files access, so it adds nothing, but it declares the app a
          # UIDocumentBrowserViewController app (we are not) and adds a
          # "Document Storage" row to iOS Settings that cannot actually move
          # the app's Documents directory — it only steers a document browser
          # we don't use, so it misleads more than it helps.
          #
          # PlistBuddy, not sed: `sed '/<\/dict>/i'` inserts before the FIRST
          # </dict>, which in a plist containing any nested dict silently buries
          # these keys inside it, where they have no effect. PlistBuddy
          # addresses the root dictionary by key path, and re-running is a
          # no-op rather than a duplicate insert.
          PLIST="src-tauri/gen/apple/PocketHLedger_iOS/Info.plist"
          if [ ! -f "$PLIST" ]; then
            PLIST=$(find src-tauri/gen/apple -name "Info.plist" -path "*_iOS*" | head -1)
          fi
          if [ -z "$PLIST" ] || [ ! -f "$PLIST" ]; then
            echo "::error::No iOS Info.plist found; the app's files would be invisible in Files"
            exit 1
          fi

          set_bool() {
            /usr/libexec/PlistBuddy -c "Add :$1 bool $2" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST"
          }
          set_bool UIFileSharingEnabled true
          set_bool LSSupportsOpeningDocumentsInPlace true

          echo "Info.plist file-sharing keys:"
          /usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :LSSupportsOpeningDocumentsInPlace" "$PLIST"

      - name: Declare export compliance
        run: |
          set -euo pipefail
          # Without this key every upload lands in TestFlight as
          # "Missing Compliance" and cannot be tested until someone
          # answers the export question by hand. The app uses only
          # standard HTTPS/system crypto, which is exempt.
          PLIST="src-tauri/gen/apple/PocketHLedger_iOS/Info.plist"
          if [ ! -f "$PLIST" ]; then
            PLIST=$(find src-tauri/gen/apple -name "Info.plist" -path "*_iOS*" | head -1)
          fi
          if [ -n "$PLIST" ] && [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
            echo "Declared ITSAppUsesNonExemptEncryption=false in $PLIST"
          else
            echo "::warning::No Info.plist found; export compliance must be answered manually"
          fi

      - name: Prepare App Store Connect API key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -n "$API_KEY" ]; then
            mkdir -p ~/.private_keys
            echo -n "$API_KEY" | base64 --decode > ~/.private_keys/AuthKey_${API_KEY_ID}.p8
            echo "API_KEY_PATH=$HOME/.private_keys/AuthKey_${API_KEY_ID}.p8" >> $GITHUB_ENV
          fi

      - name: Build iOS release
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.API_KEY_PATH }}
        run: npx tauri ios build --export-method app-store-connect

      - name: Find IPA
        id: find-ipa
        run: |
          FOUND_IPA=$(find src-tauri/gen/apple ~/Library/Developer/Xcode -name "*.ipa" 2>/dev/null | head -1)
          if [ -n "$FOUND_IPA" ]; then
            mkdir -p $RUNNER_TEMP/export
            cp "$FOUND_IPA" $RUNNER_TEMP/export/PocketHLedger.ipa
            echo "ipa_path=$RUNNER_TEMP/export/PocketHLedger.ipa" >> $GITHUB_OUTPUT
          else
            echo "::error::No IPA found after build"
            exit 1
          fi

      - name: Upload to TestFlight
        if: env.API_KEY_PATH != ''
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f ${{ steps.find-ipa.outputs.ipa_path }} \
            --type ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ${{ steps.find-ipa.outputs.ipa_path }}
          retention-days: 90

      - name: Upload IPA to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ steps.find-ipa.outputs.ipa_path }}
